# Bootstrap (once): kubectl apply -n argocd -f argocd/root/dev.yaml
# Argo CD then manages every child Application in argocd/dev/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BigDatalex/confluent-platform.git
    targetRevision: main
    path: argocd/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
