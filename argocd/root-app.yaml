# Bootstrap: kubectl apply -n argocd -f argocd/root-app.yaml
# Argo CD then manages charts/confluent-apps, which creates the operator and stack Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BigDatalex/confluent-platform.git
    targetRevision: main
    path: charts/confluent-apps
    helm:
      valuesObject:
        repoURL: https://github.com/BigDatalex/confluent-platform.git
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
