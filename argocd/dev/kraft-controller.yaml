apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-kraft-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/BigDatalex/confluent-platform.git
    targetRevision: main
    path: components/kraft-controller/chart
    helm:
      releaseName: kraft-controller
      valueFiles:
        - ../values/common.yaml
        - ../values/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: confluentplatform-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true   # CFK CRDs may not exist yet on first sync
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
