{{- range $name, $stack := .Values.stacks }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: confluent-operator-{{ $name }}
  namespace: {{ $.Values.argocdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.project }}
  source:
    repoURL: {{ $.Values.operator.repoURL }}
    chart: {{ $.Values.operator.chart }}
    targetRevision: {{ $.Values.operator.version | quote }}
    helm:
      releaseName: confluent-operator
      # CRDs are cluster-scoped, so only one operator Application may own them.
      skipCrds: {{ not $stack.installCrds }}
      valuesObject:
        namespaced: true
  destination:
    server: {{ $.Values.destinationServer }}
    namespace: {{ $stack.namespace }}
  syncPolicy:
    {{- /* CFK CRDs exceed the client-side apply annotation size limit. */}}
    {{- include "confluent-apps.syncPolicy" (dict "root" $ "extraSyncOptions" (list "ServerSideApply=true")) | trim | nindent 4 }}
{{- end }}
