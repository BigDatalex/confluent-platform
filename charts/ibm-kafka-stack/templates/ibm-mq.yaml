{{- if .Values.ibmmq.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibmmq
  namespace: {{ .Release.Namespace }}
  labels:
    app: ibmmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ibmmq
  template:
    metadata:
      labels:
        app: ibmmq
    spec:
      containers:
        - name: ibmmq
          image: {{ .Values.ibmmq.image }}
          env:
            - name: LICENSE
              value: "accept"
            - name: MQ_QMGR_NAME
              value: {{ .Values.ibmmq.queueManager }}
            - name: MQ_APP_PASSWORD
              value: {{ .Values.ibmmq.password }}
          ports:
            - containerPort: 1414
              name: mq
            - containerPort: 9443
              name: console
---
apiVersion: v1
kind: Service
metadata:
  name: ibmmq
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 1414
      targetPort: 1414
      name: mq
    - port: 9443
      targetPort: 9443
      name: console
  selector:
    app: ibmmq
{{- end }}
