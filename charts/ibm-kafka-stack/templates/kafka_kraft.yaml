apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: {{ .Release.Namespace }}
spec:
  podTemplate:
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  replicas: {{ .Values.kafka.replicas }}
  dataVolumeCapacity: 10Gi
  image:
    application: {{ .Values.kafka.image }}
    init: {{ .Values.kafka.initImage }}
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  podTemplate:
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  replicas: {{ .Values.kafka.replicas }}
  dataVolumeCapacity: 10Gi
  image:
    application: {{ .Values.kafka.image }}
    init: {{ .Values.kafka.initImage }}
  metricReporter:
    enabled: false
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
        namespace: {{ .Release.Namespace }}
---
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: {{ .Release.Namespace }}
spec:
  podTemplate:
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  replicas: 1
  image:
    application: {{ .Values.schemaRegistry.image }}
    init: {{ .Values.kafka.initImage }}
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: {{ .Release.Namespace }}
spec:
  podTemplate:
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  replicas: 1
  image:
    application: {{ .Values.controlCenter.image }}
    init: {{ .Values.kafka.initImage }}
  dataVolumeCapacity: 10Gi
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
    schemaRegistry:
      url: http://schemaregistry.{{ .Release.Namespace }}.svc.cluster.local:8081
---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect-cluster
  namespace: {{ .Release.Namespace }}
spec:
  podTemplate:
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  replicas: {{ .Values.connect.replicas }}
  image:
    application: {{ .Values.connect.image }}
    init: {{ .Values.kafka.initImage }}
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
    schemaRegistry:
      url: http://schemaregistry.{{ .Release.Namespace }}.svc.cluster.local:8081
