{{- if .Values.clusterLink.enabled }}
apiVersion: platform.confluent.io/v1beta1
kind: ClusterLink
metadata:
  name: {{ .Values.clusterLink.name }}
  namespace: {{ .Release.Namespace }}
spec:
  destinationKafkaCluster:
    kafkaRestClassRef:
      name: default
      namespace: {{ .Release.Namespace }}
  sourceKafkaCluster:
    bootstrapEndpoint: kafka.{{ .Values.clusterLink.sourceNamespace }}.svc.cluster.local:9092
    kafkaRestClassRef:
      name: default
      namespace: {{ .Values.clusterLink.sourceNamespace }}
{{- end }}
