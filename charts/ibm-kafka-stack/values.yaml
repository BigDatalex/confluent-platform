kafka:
  replicas: 3
  image: confluentinc/cp-server:7.6.0
  initImage: confluentinc/confluent-init-container:2.8.0

schemaRegistry:
  image: confluentinc/cp-schema-registry:7.6.0

controlCenter:
  image: confluentinc/cp-enterprise-control-center:7.6.0

ibmmq:
  enabled: true
  image: icr.io/ibm-messaging/mq:latest
  password: "password"
  queueManager: "QM1"
  queueName: "DEV.QUEUE.1"

connect:
  image: custom-connect-ibmmq:7.6.0
  replicas: 1

topic:
  name: ibmmq-messages
  partitions: 1
  replicas: 3

# Only enable on the destination release; it pulls from the source cluster.
clusterLink:
  enabled: false
  name: source-to-destination-link
  sourceNamespace: source
