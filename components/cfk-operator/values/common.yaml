# Values for the external chart confluent-for-kubernetes (packages.confluent.io).
# The chart version is pinned in argocd/<env>/cfk-operator.yaml (targetRevision).

# The operator runs in openshift-confluent-operator and watches only the
# namespaces in namespaceList (set per environment, rendered as --namespaces=...).
# With namespaceList set, the chart grants the operator's ServiceAccount a
# ClusterRole/ClusterRoleBinding so it can manage resources outside its own namespace.
namespaced: true
