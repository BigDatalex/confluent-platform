apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  dataVolumeCapacity: {{ .Values.dataVolumeCapacity }}
  image:
    application: {{ required "image.application is required" .Values.image.application }}
    init: {{ required "image.init is required" .Values.image.init }}
  dependencies:
    kafka:
      bootstrapEndpoint: {{ .Values.dependencies.kafka.name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.dependencies.kafka.port }}
    schemaRegistry:
      url: http://{{ .Values.dependencies.schemaRegistry.name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.dependencies.schemaRegistry.port }}
    {{- if .Values.nextGen.enabled }}
    prometheusClient:
      url: http://{{ .Values.name }}.{{ .Release.Namespace }}.svc.cluster.local:9090
    alertManagerClient:
      url: http://{{ .Values.name }}.{{ .Release.Namespace }}.svc.cluster.local:9093
    {{- end }}
  {{- if .Values.nextGen.enabled }}
  services:
    prometheus:
      image: {{ required "nextGen.prometheus.image is required" .Values.nextGen.prometheus.image }}
      pvc:
        dataVolumeCapacity: {{ .Values.nextGen.prometheus.dataVolumeCapacity }}
    alertmanager:
      image: {{ required "nextGen.alertmanager.image is required" .Values.nextGen.alertmanager.image }}
  {{- end }}
  {{- with .Values.license }}
  license:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.podTemplate.resources }}
  podTemplate:
    resources:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- with .Values.jvm }}
  configOverrides:
    jvm:
      {{- toYaml . | nindent 6 }}
  {{- end }}
