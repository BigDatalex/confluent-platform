# Chart defaults. Deployment-specific settings belong in ../values/.
name: controlcenter
replicas: 1
dataVolumeCapacity: 10Gi

image:
  application: ""   # required, set in values/common.yaml
  init: ""          # required, set in values/common.yaml

dependencies:
  kafka:
    name: kafka            # must match the name in the kafka chart
    port: 9092
  schemaRegistry:
    name: schemaregistry   # must match the name in the schema-registry chart
    port: 8081

# Next-gen Control Center (2.x) with its bundled Prometheus and Alertmanager.
# Disabled: Control Center (Legacy). Switching needs a new name, as there is
# no in-place upgrade from Legacy. Kafka and KRaft send their metrics to it
# via metricsClient.controlCenterName in their charts.
nextGen:
  enabled: false
  prometheus:
    image: ""   # required when enabled, same tag as image.application
    dataVolumeCapacity: 10Gi
  alertmanager:
    image: ""   # required when enabled, same tag as image.application

podTemplate:
  resources: {}

# CFK spec.configOverrides.server, e.g. [offsets.topic.replication.factor=1].
# Empty: CFK defaults.
serverConfig: []

# CFK spec.configOverrides.jvm, e.g. [-Xms1G, -Xmx1G]. Empty: CFK default heap (256M).
jvm: []

# CFK spec.license, e.g. {secretRef: confluent-license}. Empty: no license (trial/developer).
license: {}
