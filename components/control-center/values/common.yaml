# Shared settings for DEV and PROD.
# Image upgrades are tested in DEV first by overriding image.* in dev.yaml,
# then moved here once promoted.
#
# Next-gen Control Center 2.7.0 (Legacy is not supported on CP 8.x;
# CFK 3.4.x supports Control Center 2.4.x - 2.7.x).
name: controlcenter-next-gen
image:
  application: confluentinc/cp-enterprise-control-center-next-gen:2.7.0
  init: confluentinc/confluent-init-container:3.4.0
nextGen:
  enabled: true
  prometheus:
    image: confluentinc/cp-enterprise-prometheus:2.7.0
  alertmanager:
    image: confluentinc/cp-enterprise-alertmanager:2.7.0
