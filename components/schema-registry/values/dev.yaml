# DEV settings (taken from the existing ibm-kafka-stack configuration).
replicas: 1
# Single Kafka broker in staging, see kafka/values/dev.yaml.
serverConfig:
  - kafkastore.topic.replication.factor=1

# Sized for local minikube (38g), see kraft-controller/values/dev.yaml.
# CFK sets the heap to 100% of the memory request.
podTemplate:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
