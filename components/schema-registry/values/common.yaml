# Shared settings for DEV and PROD.
# Image upgrades are tested in DEV first by overriding image.* in dev.yaml,
# then moved here once promoted.
image:
  application: confluentinc/cp-schema-registry:8.4.0
  init: confluentinc/confluent-init-container:3.4.0

# CFK default pod resources (docs.confluent.io/operator/current/co-plan-sizing.html),
# set explicitly for DEV and PROD.
podTemplate:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

