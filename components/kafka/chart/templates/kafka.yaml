apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  dataVolumeCapacity: {{ .Values.dataVolumeCapacity }}
  image:
    application: {{ required "image.application is required" .Values.image.application }}
    init: {{ required "image.init is required" .Values.image.init }}
  metricReporter:
    enabled: {{ .Values.metricReporter.enabled }}
  dependencies:
    kRaftController:
      clusterRef:
        name: {{ .Values.dependencies.kraftController.name }}
        namespace: {{ .Release.Namespace }}
  {{- with .Values.license }}
  license:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.podTemplate.resources }}
  podTemplate:
    resources:
      {{- toYaml . | nindent 6 }}
  {{- end }}
