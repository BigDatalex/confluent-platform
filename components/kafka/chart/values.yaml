# Chart defaults. Deployment-specific settings belong in ../values/.
name: kafka
replicas: 3
dataVolumeCapacity: 10Gi

image:
  application: ""   # required, set in values/common.yaml
  init: ""          # required, set in values/common.yaml

metricReporter:
  enabled: false

dependencies:
  kraftController:
    name: kraftcontroller   # must match the name in the kraft-controller chart

# Name of a next-gen Control Center in the same namespace to send metrics to
# (CFK spec.dependencies.metricsClient). Empty: no metrics export.
metricsClient:
  controlCenterName: ""

podTemplate:
  resources: {}

# CFK spec.configOverrides.server, e.g. [offsets.topic.replication.factor=1].
# Empty: CFK defaults.
serverConfig: []

# CFK spec.configOverrides.jvm, e.g. [-Xms6G, -Xmx6G]. Empty: CFK default heap,
# min(50% of the memory request, 32Gi) for brokers.
jvm: []

# CFK spec.license, e.g. {secretRef: confluent-license}. Empty: no license (trial/developer).
license: {}
