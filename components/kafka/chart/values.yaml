# Chart defaults. Deployment-specific settings belong in ../values/.
name: kafka
replicas: 3
dataVolumeCapacity: 10Gi

image:
  application: ""   # required, set in values/common.yaml
  init: ""          # required, set in values/common.yaml

metricReporter:
  enabled: false

dependencies:
  kraftController:
    name: kraftcontroller   # must match the name in the kraft-controller chart

podTemplate:
  resources: {}

# CFK spec.configOverrides.jvm, e.g. [-Xms1G, -Xmx1G]. Empty: CFK default heap (256M).
jvm: []

# CFK spec.license, e.g. {secretRef: confluent-license}. Empty: no license (trial/developer).
license: {}
