# Shared settings for DEV and PROD.
# Image upgrades are tested in DEV first by overriding image.* in dev.yaml,
# then moved here once promoted.
image:
  application: confluentinc/cp-server:7.6.0
  init: confluentinc/confluent-init-container:2.8.0

# CFK sets the JVM heap (-Xms/-Xmx) to the memory request, so the request is
# the heap size and the limit must be higher (page cache, off-heap). With
# request == limit the container is OOMKilled. Baseline; override per env.
podTemplate:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

