# Shared settings for DEV and PROD.
# Image upgrades are tested in DEV first by overriding image.* in dev.yaml,
# then moved here once promoted.
image:
  application: confluentinc/cp-server:8.4.0
  init: confluentinc/confluent-init-container:3.4.0

# Metrics export to the next-gen Control Center, see
# control-center/values/common.yaml.
metricsClient:
  controlCenterName: controlcenter-next-gen
