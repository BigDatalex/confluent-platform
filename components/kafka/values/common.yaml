# Shared settings for DEV and PROD.
# Image upgrades are tested in DEV first by overriding image.* in dev.yaml,
# then moved here once promoted.
image:
  application: confluentinc/cp-server:7.6.0
  init: confluentinc/confluent-init-container:2.8.0

# CFK defaults (256M heap, 512Mi limit) are too small: cp-server brokers run
# out of heap (java.lang.OutOfMemoryError) and fail their readiness probes.
jvm:
  - -Xms1G
  - -Xmx1G
podTemplate:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi

