# DEV settings (taken from the existing ibm-kafka-stack configuration).
# Staging: a single broker, so every internal topic needs replication factor 1
# (defaults are 3; topic creation fails with fewer brokers). Same for the
# internal topics of Connect, Schema Registry and Control Center (dev.yaml).
replicas: 1
# Staging PVC budget is 200Gi: Kafka 150Gi, KRaft 10Gi, Control Center 10Gi,
# Prometheus 10Gi.
dataVolumeCapacity: 150Gi
serverConfig:
  - offsets.topic.replication.factor=1
  - transaction.state.log.replication.factor=1
  - transaction.state.log.min.isr=1
  - confluent.license.topic.replication.factor=1
  - confluent.metadata.topic.replication.factor=1
  - confluent.balancer.topic.replication.factor=1
  - confluent.metrics.reporter.topic.replicas=1
  - confluent.tier.metadata.replication.factor=1
  - confluent.security.event.logger.exporter.kafka.topic.replicas=1
  - event.logger.exporter.kafka.topic.replicas=1

# Sized for local minikube (38g), see kraft-controller/values/dev.yaml.
# CFK sets the broker heap to 50% of the memory request (2Gi), see prod.yaml.
# Ephemeral storage is requested explicitly as on HICP, where the quota
# limits requests.ephemeral-storage and the LimitRange has no default for it.
podTemplate:
  resources:
    requests:
      cpu: 1500m
      memory: 4Gi
      ephemeral-storage: 1Gi
    limits:
      cpu: "3"
      memory: 8Gi

# Minimal test (Kafka + KRaft only): no Control Center to export
# metrics to, so metrics export is disabled.
metricsClient:
  controlCenterName: ""
