# DEV settings (taken from the existing ibm-kafka-stack configuration).
replicas: 3
dataVolumeCapacity: 10Gi

# Sized for local minikube: 3 brokers with 5Gi/10Gi starved etcd and the API
# server. CFK derives the heap from the memory request, see common.yaml.
podTemplate:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
