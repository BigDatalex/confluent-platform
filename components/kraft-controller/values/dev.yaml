# DEV settings (taken from the existing ibm-kafka-stack configuration).
# Staging: a single controller (no quorum fault tolerance). Scaling KRaft
# controllers in place is not supported; changing this needs a fresh cluster.
replicas: 1
dataVolumeCapacity: 10Gi

# Sized for local minikube (minikube start --memory 38g): memory limits stay
# well below 38g, so the JVMs cannot starve etcd and the API server. CPU as
# in staging (hicp-sizing-and-artifactory branch); requests are half the limits.
#   Limits (CPU / memory)   CFK minimum   minikube
#   Kafka                   4 / 16Gi      3 / 8Gi
#   KRaft controller        3 / 4Gi       1.5 / 2Gi
#   Connect                 4 / 16Gi      2 / 4Gi
#   Schema Registry         2 / 4Gi       1 / 2Gi
#   Control Center          4 / 8Gi       2 / 8Gi
#   Total                   17 / 48Gi     9.5 / 24Gi
# The rest is left for Kubernetes, Argo CD, the CFK operator, and Prometheus
# and Alertmanager in the Control Center pod.
# CFK sets the controller heap to 80% of the memory request.
podTemplate:
  resources:
    requests:
      cpu: 750m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 2Gi
