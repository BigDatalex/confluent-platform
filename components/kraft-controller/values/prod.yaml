# PROD settings. Initial sizing assumption, to be confirmed before go-live.
replicas: 3
dataVolumeCapacity: 10Gi

# Prod quota: 24 CPU / 96Gi limits and 300Gi PVC for the whole namespace.
# Kafka gets the CFK minimum (docs.confluent.io/operator/current/co-plan-sizing.html),
# the other components are scaled down to fit; requests are half the limits.
#   Limits per pod (CPU / memory)  CFK minimum  prod      pods  total
#   Kafka                          4 / 16Gi     4 / 16Gi  3     12 / 48Gi
#   KRaft controller               3 / 4Gi      1 / 4Gi   3     3 / 12Gi
#   Connect                        4 / 16Gi     1.5 / 8Gi 2     3 / 16Gi
#   Schema Registry                2 / 4Gi      0.5 / 2Gi 2     1 / 4Gi
#   Control Center                 4 / 8Gi      2 / 8Gi   1     2 / 8Gi
#   Total                                                      21 / 88Gi
# The rest (3 CPU / 8Gi) is left for Prometheus and Alertmanager in the
# Control Center pod, which get the namespace's default limits.
# PVC: Kafka 3 x 80Gi, KRaft 3 x 10Gi, Control Center 10Gi, Prometheus 10Gi
# = 290Gi.
# CFK sets the controller heap to 80% of the memory request.
podTemplate:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
