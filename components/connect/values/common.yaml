# Shared settings for DEV and PROD.
# Image upgrades are tested in DEV first by overriding image.* in dev.yaml,
# then moved here once promoted.
image:
  application: confluentinc/cp-server-connect:8.4.0
  init: confluentinc/confluent-init-container:3.4.0

# CFK defaults (256M heap, 512Mi limit) are too small: heap plus the metaspace
# for plugin scanning in cp-server-connect exceeds 512Mi (OOMKilled).
# Keep the memory limit in dev.yaml/prod.yaml well above the heap.
jvm:
  - -Xms1G
  - -Xmx1G
