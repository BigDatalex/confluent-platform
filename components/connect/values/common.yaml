# Shared settings for DEV and PROD.
# Image upgrades are tested in DEV first by overriding image.* in dev.yaml,
# then moved here once promoted.
image:
  application: confluentinc/cp-server-connect:7.6.0
  init: confluentinc/confluent-init-container:2.8.0

# Connect needs more than the CFK defaults (256Mi/512Mi): 256M heap plus the
# metaspace for plugin scanning in cp-server-connect exceeds 512Mi (OOMKilled).
podTemplate:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

