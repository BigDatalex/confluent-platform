# DEV settings.
replicas: 1
# Single Kafka broker in staging, see kafka/values/dev.yaml.
serverConfig:
  - config.storage.replication.factor=1
  - offset.storage.replication.factor=1
  - status.storage.replication.factor=1
  - confluent.topic.replication.factor=1

# Sized for local minikube (38g), see kraft-controller/values/dev.yaml.
# Heap: CFK default (100% of the memory request, 2Gi) instead of the fixed 1G
# from common.yaml, which is sized for the 2Gi limit in prod.
jvm: []
podTemplate:
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
