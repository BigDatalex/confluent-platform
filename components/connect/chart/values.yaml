# Chart defaults. Deployment-specific settings belong in ../values/.
name: connect-cluster
replicas: 1

image:
  application: ""   # required, set in values/common.yaml
  init: ""          # required, set in values/common.yaml

dependencies:
  kafka:
    name: kafka            # must match the name in the kafka chart
    port: 9092
  schemaRegistry:
    name: schemaregistry   # must match the name in the schema-registry chart
    port: 8081

podTemplate:
  resources: {}
